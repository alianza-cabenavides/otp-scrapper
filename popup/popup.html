<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alianza OTP Pruebas</title>
  <link rel="stylesheet" href="../styles/app.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="topbar">
    <h1>OTP Pruebas</h1>
    <div class="topbar-actions">
      <div id="countdown" class="countdown" hidden
           role="timer" aria-live="off" title="Tiempo restante del código">
        <svg viewBox="0 0 36 36" aria-hidden="true">
          <circle class="ring-bg" cx="18" cy="18" r="16"></circle>
          <circle id="ring-fg" class="ring-fg" cx="18" cy="18" r="16"></circle>
        </svg>
        <span id="countdown-text" class="countdown-text">--</span>
      </div>
      <button id="refresh" class="btn btn--icon" type="button" title="Refrescar" aria-label="Refrescar">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08C16.83 16.33 14.61 18 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
      <button id="open-options" class="btn btn--icon" type="button" title="Opciones" aria-label="Opciones">⚙️</button>
    </div>
  </header>

  <main id="content" class="content">
    <p class="placeholder">Pulsa <strong>Refrescar</strong> para consultar el OTP.</p>
  </main>

  <footer id="footer" class="footer"></footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
