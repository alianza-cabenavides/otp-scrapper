<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opciones — OTP Pruebas</title>
  <link rel="stylesheet" href="../styles/app.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="wrap">
    <h1>OTP Pruebas — Opciones</h1>

    <form id="config-form">
      <section class="card">
        <h2>Credenciales del sitio OTP</h2>
        <p id="otpCredentialsDescription" class="credentials__description">
          Usa el usuario y la contraseña asignados para el sitio OTP, no los de Windows.
        </p>
        <div class="field">
          <label for="username">Usuario</label>
          <input class="input" id="username" name="username" type="text" autocomplete="off"
                 aria-describedby="otpCredentialsDescription" required />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input class="input" id="password" name="password" type="password" autocomplete="off"
                 aria-describedby="otpCredentialsDescription" required />
        </div>
      </section>

      <details class="advanced card">
        <summary>Configuración avanzada</summary>
        <div class="advanced__content">
          <div class="advanced__section">
            <div class="field">
              <label for="baseUrl">URL del sitio OTP</label>
              <input class="input" id="baseUrl" name="baseUrl" type="url"
                     placeholder="https://host:puerto" autocomplete="off" required />
            </div>
          </div>

          <div class="advanced__section">
            <div class="field">
              <label for="portalOrigins">URLs de los portales</label>
              <textarea class="input" id="portalOrigins" name="portalOrigins" rows="3"
                        placeholder="https://portal-a.ejemplo.com&#10;https://portal-b.ejemplo.com"
                        autocomplete="off" spellcheck="false" required></textarea>
            </div>
          </div>

          <div class="advanced__section">
            <div class="field">
              <label for="otpInputSelector">Selector CSS del campo</label>
              <input class="input" id="otpInputSelector" name="otpInputSelector" type="text"
                     placeholder="#token, input.token-digit" autocomplete="off" spellcheck="false" />
            </div>
          </div>

          <div class="advanced__section">
            <div class="field">
              <label for="otpPeriod">Duración del código (segundos)</label>
              <input class="input" id="otpPeriod" name="otpPeriod" type="number" min="5" max="600" step="5" />
            </div>
          </div>
        </div>
      </details>

      <div class="actions">
        <button type="submit" class="btn">Guardar</button>
        <span id="status" class="status" role="status" aria-live="polite"></span>
      </div>
    </form>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
